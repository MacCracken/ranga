name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # ⚠ ALL FEATURES, not the default set. `cyrius test` auto-discovers
        # every tests/*.tcyr, and the spectral / hwaccel / gpu suites include
        # lib/prakash.cyr, lib/ai-hwaccel.cyr and lib/mabda.cyr respectively.
        # A bare `cyrius deps` never vendors those, so the suites fail to
        # compile — the features are off by DEFAULT for consumers, but the repo
        # tests all of them.
        run: cyrius deps --features spectral,hwaccel,gpu

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        #
        # The GPU suites gate every hardware assertion on a context actually
        # opening, so they pass on a runner with no GPU — see the note at the
        # top of tests/gpu.tcyr. What they still exercise there is the SPIR-V
        # emitter, the error mapping and every guard.
        run: cyrius test

      - name: Lint
        # 0 warnings and 0 untracked deferrals is the standing bar; this makes
        # it a gate rather than a habit.
        run: cyrius lint src/*.cyr tests/*.tcyr

      - name: Bundles are current
        # --check compares BYTES, so a source change that was never re-bundled
        # fails here instead of shipping a stale dist/. All four profiles.
        run: cyrius distlib --check
