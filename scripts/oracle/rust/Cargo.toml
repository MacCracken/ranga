# The Rust side of the differential oracle (scripts/oracle/README.md).
# It depends on the frozen Rust 1.0.1 crate by path and never builds inside it.
[package]
name = "ranga-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ranga = { path = "../../../rust-old" }
# The serde group (src/serde.cyr's codecs against serde_json). Exact pins, matching
# the versions rust-old/Cargo.lock already resolves, so no new crate enters the
# build and it stays offline.
serde = "=1.0.229"
serde_json = "=1.0.151"

[profile.release]
debug = false

# Standalone: not a member of any enclosing workspace.
[workspace]
